name: bump-version

on:
  pull_request:

concurrency:
  group: bump-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.VERSION_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Bump the patch version
        uses: gi-org-pl/bump-version-action@a83487b094435cf604af192ddcfcb96129b0cd1f # v1.0.0
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
