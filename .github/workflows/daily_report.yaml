name: daily_report

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC, 13:00 for Europe/Warsaw
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Set up Node.js'
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: 'Install dependencies'
        run: "npm ci"
      - name: 'Generate and send daily report'
        run: "node index.js"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MYPOLITICS_API_URL: "https://api.mypolitics.pl"
          ALLOWED_USER_AGENT: ${{ secrets.ALLOWED_USER_AGENT }}
