name: daily_report

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC, 13:00 for Europe/Warsaw
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: 'Set up Node.js'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: 'Install dependencies'
        run: "npm ci"
      - name: 'Generate and send daily report'
        run: "node index.js"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MYPOLITICS_API_URL: "https://api.mypolitics.pl"
          ALLOWED_USER_AGENT: ${{ secrets.ALLOWED_USER_AGENT }}
          MYPOLITICS_ADMIN_TOKEN: ${{ secrets.MYPOLITICS_ADMIN_TOKEN }}
