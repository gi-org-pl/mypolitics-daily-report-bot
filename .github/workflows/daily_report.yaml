name: daily_report

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC, 13:00 for Europe/Warsaw
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Set up Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: 'Install dependencies'
        run: "npm ci"
      - name: 'Generate and send daily report'
        run: "node index.js"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MYPOLITICS_API_URL: "https://api.mypolitics.pl"
          ALLOWED_USER_AGENT: ${{ secrets.ALLOWED_USER_AGENT }}
          MYPOLITICS_ADMIN_TOKEN: ${{ secrets.MYPOLITICS_ADMIN_TOKEN }}
